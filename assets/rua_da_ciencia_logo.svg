<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <linearGradient id="signGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00963d" />
      <stop offset="60%" stop-color="#007a31" />
      <stop offset="100%" stop-color="#005d25" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Octógono Placa de Trânsito Rua da Ciência -->
    <polygon points="120,20 280,20 380,120 380,280 280,380 120,380 20,280 20,120" 
             fill="url(#signGreen)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Filete interno branco -->
    <polygon points="124,36 276,36 364,124 364,276 276,364 124,364 36,276 36,124" 
             fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.85" />

    <!-- Tipografia Oficial Rua da Ciência -->
    <g fill="#ffffff" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif">
      <!-- RUA + da -->
      <text x="180" y="165" font-size="76" font-weight="900" letter-spacing="1">RUA</text>
      
      <!-- Caixa do "da" -->
      <rect x="254" y="108" width="48" height="42" rx="8" fill="#ffffff" />
      <text x="278" y="142" font-size="34" font-weight="900" fill="#007a31">da</text>

      <!-- CIÊNCIA -->
      <text x="200" y="248" font-size="64" font-weight="900" letter-spacing="-1">CIÊNCIA</text>

      <!-- 12ª SIIEPE / UFPEL -->
      <line x1="85" y1="272" x2="315" y2="272" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
      <text x="200" y="315" font-size="28" font-weight="800" letter-spacing="3" opacity="0.95">12ª SIIEPE</text>
      <text x="200" y="342" font-size="18" font-weight="700" letter-spacing="2" opacity="0.85">UFPel 2026</text>
    </g>
  </g>
</svg>
