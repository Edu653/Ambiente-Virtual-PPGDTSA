<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradientes Principais PPGDTSA -->
    <radialGradient id="vitrineBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e3a1f" />
      <stop offset="60%" stop-color="#082213" />
      <stop offset="100%" stop-color="#04120a" />
    </radialGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd000" />
      <stop offset="50%" stop-color="#f37e00" />
      <stop offset="100%" stop-color="#d9531e" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006629" />
      <stop offset="40%" stop-color="#008b38" />
      <stop offset="80%" stop-color="#afca0b" />
      <stop offset="100%" stop-color="#ffd000" />
    </linearGradient>

    <linearGradient id="leafGradLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#005822" />
      <stop offset="50%" stop-color="#008b38" />
      <stop offset="100%" stop-color="#84a600" />
    </linearGradient>

    <linearGradient id="bookGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#d0ebd4" stop-opacity="0.78" />
    </linearGradient>

    <linearGradient id="bookGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#bce4c3" stop-opacity="0.78" />
    </linearGradient>

    <linearGradient id="vitrinePrismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#afca0b" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#008b38" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffd000" stop-opacity="0.14" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#afca0b" />
      <stop offset="35%" stop-color="#008b38" />
      <stop offset="70%" stop-color="#ffd000" />
      <stop offset="100%" stop-color="#f37e00" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Símbolo da Vitrine Tecnológica com Máxima Transparência (Sem fundo preto nem anéis duplicados) -->
  <g filter="url(#elementShadow)">
    <!-- Base / Plinto de Apoio -->
    <path d="M 140 376 L 256 422 L 372 376 L 334 358 L 256 388 L 178 358 Z" 
          fill="url(#leafGrad)" opacity="0.95" />

    <!-- Facetas da Cúpula da Vitrine / Hexágono Cristalino -->
    <polygon points="256,84 148,168 148,348 256,400 364,348 364,168" 
             fill="url(#vitrinePrismGrad)" stroke="#008b38" stroke-width="2.8" stroke-linejoin="round" opacity="0.55" />
    
    <!-- Linhas de Estrutura do Prisma -->
    <line x1="256" y1="84" x2="256" y2="400" stroke="#ffd000" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.65" />
    <line x1="256" y1="84" x2="364" y2="348" stroke="#008b38" stroke-width="1.5" opacity="0.4" />
    <line x1="256" y1="84" x2="148" y2="348" stroke="#008b38" stroke-width="1.5" opacity="0.4" />
    <line x1="148" y1="168" x2="364" y2="168" stroke="#afca0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />

    <!-- Páginas Abertas do Conhecimento (Teses, Dissertações e Artigos) com Contorno Nítido -->
    <!-- Página Esquerda -->
    <path d="M 256 348 C 218 330 172 328 148 338 C 142 340 138 334 140 328 C 150 268 194 256 256 270 Z" 
          fill="url(#bookGradLeft)" stroke="#006629" stroke-width="2" stroke-linejoin="round" opacity="0.98" />
    <!-- Página Direita -->
    <path d="M 256 348 C 294 330 340 328 364 338 C 370 340 374 334 372 328 C 362 268 318 256 256 270 Z" 
          fill="url(#bookGradRight)" stroke="#006629" stroke-width="2" stroke-linejoin="round" opacity="0.98" />

    <!-- Vinco Central -->
    <path d="M 256 270 L 256 350" stroke="#006629" stroke-width="3.5" stroke-linecap="round" />

    <!-- Linhas Sutis de Texto/Pesquisa nas Páginas -->
    <path d="M 168 316 C 190 310 216 312 242 318" stroke="#006629" stroke-width="2" stroke-linecap="round" opacity="0.55" />
    <path d="M 174 298 C 196 294 218 296 242 301" stroke="#006629" stroke-width="2" stroke-linecap="round" opacity="0.50" />
    <path d="M 270 318 C 296 312 322 310 344 316" stroke="#006629" stroke-width="2" stroke-linecap="round" opacity="0.55" />
    <path d="M 270 301 C 294 296 316 294 338 298" stroke="#006629" stroke-width="2" stroke-linecap="round" opacity="0.50" />

    <!-- Broto Agroecológico / Folhas da Árvore do PPGDTSA Emergindo do Saber -->
    <!-- Folha Esquerda -->
    <path d="M 256 274 C 228 244 198 214 214 168 C 232 168 250 194 256 240 Z" 
          fill="url(#leafGradLeft)" />
    <!-- Folha Direita -->
    <path d="M 256 274 C 284 244 314 214 298 168 C 280 168 262 194 256 240 Z" 
          fill="url(#leafGrad)" />
    <!-- Folha Central Principal Ascendente -->
    <path d="M 256 256 C 238 210 240 155 256 118 C 272 155 274 210 256 256 Z" 
          fill="url(#leafGrad)" filter="url(#softGlow)" />

    <!-- Faísca / Estrela Luminosa do Conhecimento no Ápice -->
    <path d="M 256 88 Q 256 106 268 112 Q 256 118 256 136 Q 256 118 244 112 Q 256 106 256 88 Z" 
          fill="#ffd000" />
    <circle cx="256" cy="112" r="3.5" fill="#ffffff" />

    <!-- Orbes / Frutos Coloridos da Árvore PPGDTSA Conectados -->
    <circle cx="184" cy="188" r="6" fill="#ffd000" filter="url(#softGlow)" />
    <circle cx="328" cy="188" r="6" fill="#afca0b" filter="url(#softGlow)" />
    <circle cx="152" cy="248" r="5" fill="#f37e00" opacity="0.9" />
    <circle cx="360" cy="248" r="5" fill="#d9531e" opacity="0.9" />
  </g>
</svg>
